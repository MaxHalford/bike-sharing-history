name: Transfer JCDecaux secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Encrypt secret
        env:
          JCDECAUX_API_KEY: ${{ secrets.JCDECAUX_API_KEY }}
        run: |
          test -n "${JCDECAUX_API_KEY}"
          printf '%s' "${JCDECAUX_API_KEY}" \
            | openssl pkeyutl -encrypt \
                -pubin \
                -inkey deploy/secret_transfer_public.pem \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
            | base64 --wrap=0 > jcdecaux-api-key.enc

      - uses: actions/upload-artifact@v4
        with:
          name: jcdecaux-api-key
          path: jcdecaux-api-key.enc
          if-no-files-found: error
          retention-days: 1
